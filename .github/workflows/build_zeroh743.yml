name: Build ZEROH743 Firmware

on:
  push:
    branches:
      - build-zeroh743
  workflow_dispatch:

concurrency:
  group: build-zeroh743-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.2.0
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Switch to ArduPilot Stable (Plane Stable)
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          
          # Backup ZEROH743 board definition
          mkdir -p /tmp/zeroh743_backup
          cp -r libraries/AP_HAL_ChibiOS/hwdef/ZEROH743/* /tmp/zeroh743_backup/
          
          # Fetch upstream stable
          git remote add upstream https://github.com/ArduPilot/ardupilot.git || git remote set-url upstream https://github.com/ArduPilot/ardupilot.git
          git fetch --tags upstream
          
          # Checkout stable tag (ArduPlane-stable points to latest Plane stable release, e.g. Plane-4.7.2)
          STABLE_TAG="ArduPlane-stable"
          echo "Checking out ArduPilot Stable tag: ${STABLE_TAG}"
          git checkout ${STABLE_TAG}
          git submodule sync --recursive
          git submodule update --init --recursive
          
          # Restore ZEROH743 board definition
          mkdir -p libraries/AP_HAL_ChibiOS/hwdef/ZEROH743
          cp /tmp/zeroh743_backup/* libraries/AP_HAL_ChibiOS/hwdef/ZEROH743/
          
          echo "=== ArduPilot Version Info ==="
          git describe --tags --always
          git log -1 --oneline

      - name: Build Bootloader and ArduPlane (Fixed-Wing & VTOL/QuadPlane)
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          export PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          python3 ./Tools/scripts/build_bootloaders.py ZEROH743
          ./waf configure --board ZEROH743
          ./waf plane
          mkdir -p firmware_output
          cp Tools/bootloaders/ZEROH743_bl.* firmware_output/
          cp build/ZEROH743/bin/arduplane* firmware_output/
          ls -lh firmware_output/

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZEROH743-ArduPlane-Stable-CAN
          path: firmware_output/*
          if-no-files-found: error
